[package]
name = "zfp_nrp"
description = "ZFP compression of f32 blocks in pure, safe Rust: a native port of the zfp library's block coder, bit-identical to zfp."
version = "0.2.1"
edition = "2024"
rust-version = "1.100"
license = "BSD-3-Clause"
repository = "https://github.com/OctoKeights/zfp_nrp"
readme = "README.md"
keywords = ["zfp", "compression", "floating-point", "lossy", "hdr"]
categories = ["compression"]

[dependencies]

[lints.rust]
# No unsafe code in the library, its tests, examples or benchmarks.
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Integer and float conversions that narrow or reinterpret are the codec's arithmetic, as they
# are in the original's C; each is deliberate, so these four are not flagged.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
